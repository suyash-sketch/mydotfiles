# onedark-theme.conf

# Set the status bar position
set -g status-position top

# Left side: Session name (using session_fg and bg)
set -g status-left "#[fg=#98c379,bold,bg=#2c323c] #S"
set -g status-left-length 200

# Right side: Date and Time (using default_fg and bg)
set -g status-right "#[fg=#abb2bf,bg=#2c323c] 󰃮 %Y-%m-%d 󱑒 %H:%M"
set -g status-right-length 200

# Center the window list
set -g status-justify centre

# Global status bar background (using bg)
set -g status-style "bg=#2c323c"

# Active window tab (using active_window_fg)
set -g window-status-current-format "#[fg=#61afef,bg=default]  #I:#W"

# Inactive window tabs (using default_fg)
set -g window-status-format "#[fg=#abb2bf,bg=default] #I:#W"
set -g window-status-last-style "fg=#abb2bf,bg=default"

# Command prompt styling (using default_fg)
set -g message-command-style "bg=default,fg=#abb2bf"
set -g message-style "bg=default,fg=#abb2bf"

# Copy mode highlighting / Selection (using selection_bg and selection_fg)
set -g mode-style "bg=#98c379,fg=#282c34"

# Pane borders (using active_pane_border)
set -g pane-active-border-style "fg=#abb2bf,bg=default"
set -g pane-border-style "fg=brightblack,bg=default"
