# dracula-theme.conf

# Set the status bar position
set -g status-position top

# Left side: Session name (Dracula Purple)
set -g status-left "#[fg=#bd93f9,bold,bg=#282a36] #S"
set -g status-left-length 200

# Right side: Date and Time (Dracula Foreground)
set -g status-right "#[fg=#f8f8f2,bg=#282a36] 󰃮 %Y-%m-%d 󱑒 %H:%M"
set -g status-right-length 200

# Center the window list
set -g status-justify centre

# Global status bar background (Dracula Background)
set -g status-style "bg=#282a36"

# Active window tab (Dracula Pink)
set -g window-status-current-format "#[fg=#ff79c6,bg=default]  #I:#W"

# Inactive window tabs (Dracula Comment/Muted)
set -g window-status-format "#[fg=#6272a4,bg=default] #I:#W"
set -g window-status-last-style "fg=#6272a4,bg=default"

# Command prompt styling
set -g message-command-style "bg=#44475a,fg=#f8f8f2"
set -g message-style "bg=#44475a,fg=#f8f8f2"

# Copy mode highlighting / Selection
set -g mode-style "bg=#44475a,fg=#f8f8f2"

# Pane borders
set -g pane-active-border-style "fg=#bd93f9,bg=default"
set -g pane-border-style "fg=#44475a,bg=default"
